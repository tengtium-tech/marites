server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The contract's server is /api/v1 — same origin. Proxying here keeps that true in the
    # container, so the browser never needs CORS and the API needs no knowledge of the UI.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: unknown paths are routes, not missing files. Without this, a refresh
    # on /setup returns 404 from nginx instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
