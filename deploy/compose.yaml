# The M0 deployment: a working UI against a test broker, with no adopter-supplied database.
#
# This file lives on `react-csharp` because it describes both stacks, and neither stack branch
# can hold it: `csharp` has no web app, `react` has no API. The pairing branch is the one place
# where running the two together is the subject (github-project.md §1).
#
# Build contexts point at the two stack worktrees — the local layout. Publishing both images
# from CI and referencing them by tag is the adopter-facing path, and is not built yet.

name: marites

services:
  api:
    build:
      # Relative to this file (deploy/), so ../../ reaches C:/Templates.
      context: ../../marites-csharp
      dockerfile: deploy/Dockerfile.api
    environment:
      # Required from first start: the service refuses to boot without it (configuration §1).
      MARITES_KEK: ${MARITES_KEK:?set MARITES_KEK to 32 random bytes, base64-encoded}
      MARITES_BOOKKEEPING_PATH: /app/data/marites.db
      ASPNETCORE_URLS: http://0.0.0.0:8080
    volumes:
      - marites-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    # No healthcheck. The aspnet base image ships neither wget nor curl, so a probe written
    # with either marks a working container unhealthy and blocks everything downstream. The
    # web service starts as soon as the container does and answers 502 until the API is up,
    # which is an honest transient rather than a false failure.

  web:
    build:
      context: ../../marites-react/apps/web
      dockerfile: Dockerfile
    ports:
      - "8081:80"   # 8080 is often already taken by a local `dotnet run`
    depends_on:
      api:
        condition: service_started

  # The test broker. In a real deployment the adopter supplies one; here it exists so the
  # stack can be brought up on a clean host and exercised end to end.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: marites
      RABBITMQ_DEFAULT_PASS: marites
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  marites-data:
